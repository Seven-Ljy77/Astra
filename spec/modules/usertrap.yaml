module: kernel/usertrap
owns:
- src/kernel/trap/trap_user.c
- src/kernel/trap/trampoline.S
state:
  trampoline: 页对齐共享代码，内核和用户页表在 TRAMPOLINE 映射同一物理页；段长不超过一页。
  TRAPFRAME: 当前进程用户页表中的非用户 RW 映射；布局由 proc/type.h 固定。
  trapframe_access: 内核页表不映射 TRAPFRAME；内核以 proc.tf 的物理地址经恒等映射访问同一页，用户态期间 sscratch 始终保持 TRAPFRAME。
  entry_address: user_vector 与 user_return 只能以 TRAMPOLINE 加段内偏移的运行时地址进入；两者切换 satp 后仍在同一虚拟地址上继续执行。
rules:
- 切换 satp 前后均在同一 TRAMPOLINE 虚拟地址执行并刷新 TLB；用户寄存器保存和恢复不得混用页表。
- 未知系统调用返回 -1；用户执行错误停止故障进程，不触发内核 panic；内核状态矛盾才 panic。
- scause 5的S-mode时钟中断调用timer_interrupt_handler，以SBI TIME重设下一次事件；scause 9的外部中断调用external_interrupt_handler。
# 保留既有往返契约；Lab5 新 syscall 和缺页功能尚待实现。
functions:
  user_vector:
    pre:
    - 由 U-mode trap 进入；satp 仍为用户页表，sscratch 为 TRAPFRAME，stvec 已指向本入口，用户通用寄存器内容需要完整保留。
    effects:
    - 以 sscratch 与 a0 交换取得 trapframe 指针，把全部 32 个通用寄存器按 trapframe 布局保存，a0 经交换后写回偏移 112。
    - 从 trapframe 读出内核 satp、内核栈顶、trap 处理入口和 hart ID；切换 satp 并刷新 TLB 后跳转到 trap 处理入口。
    post:
    - 用户现场完整保存在 trapframe 中且此后不再使用用户页表；进入处理入口时 sp 为当前进程内核栈顶、tp 为 hart ID、satp 为内核页表。
    - 进入处理入口时 a0 仍为 TRAPFRAME，该地址在内核页表中无效，处理函数不得解引用它，只能经 proc.tf 访问同一页。
    - 保存过程只使用 sscratch 和 trapframe 且不修改其前五槽，不读写其他内核对象。

  void trap_user_handler(void):
    pre:
    - 由 user_vector 从 U-mode trap 进入，sstatus.SPP 为 0，当前中断关闭。
    - 当前使用内核页表和当前进程的内核栈，tp 保存有效 hart ID，myproc() 及其 tf 有效。
    - 用户通用寄存器已保存到 trapframe，sepc、scause、stval 保存本次 trap 的现场信息。
    effects:
    - 将 stvec 切换为 kernel_vector，供内核执行期间的 trap 使用。
    - 将 sepc 保存到当前进程 tf.user_to_kern_epc，读取 scause 并区分中断与异常。
    - 时钟中断调用 timer_interrupt_handler，外部中断调用 external_interrupt_handler；不推进保存的用户 PC。
    - U-mode ecall 从 tf.a7 读取系统调用号；Lab4 的 SYS_helloworld 分支仅作为禁用的学习记录保留；当前暂返回 -1。Lab5 待接入 syscall 分派，具体服务遵循 syscall.yaml。
    - 对 ecall 将保存的用户 PC 增加 4，跳过 ecall 指令。
    - 可恢复的处理完成后调用 trap_user_return；用户执行错误输出诊断、清空当前 cpu.proc，并在开启中断的内核 wfi 循环中停止故障用户执行。
    post:
    - 系统调用或已处理的中断经 trap_user_return 返回 U-mode；除规定修改的返回值与 PC 外，用户现场保持可继续执行。
    - 用户错误不触发整个内核 panic，不再返回用户态；本阶段保留故障进程资源供诊断，不实现完整退出或资源回收。内核执行状态矛盾属于内核不变量错误。
    - 诊断原因编号时不得越界访问提示数组，正常返回用户态的路径不返回本函数的调用位置。

  void trap_user_return(void):
    pre:
    - 当前在 S-mode 使用内核页表，tp 保存有效 hart ID，myproc()、tf 和用户页表均有效。
    - 用户代码、用户栈、TRAPFRAME 和 TRAMPOLINE 映射已准备好，trapframe 中的用户寄存器和返回 PC 有效。
    - 当前进程内核栈已在内核页表中映射；两张页表在 TRAMPOLINE 映射同一代码物理页。
    effects:
    - 关闭当前 hart 的 S-mode 中断响应，防止返回准备过程被中断打断。
    - 在 trapframe 中填写当前内核 satp、进程内核栈顶、trap_user_handler 地址和 hart ID，供下一次用户 trap 使用。
    - 将 stvec 设置为 TRAMPOLINE 加 user_vector 段内偏移，将 sepc 设置为 tf.user_to_kern_epc。
    - 清除 sstatus.SPP，设置 sstatus.SPIE，保留其他状态位，准备 sret 返回 U-mode。
    - 计算 user_return 的 TRAMPOLINE 高虚拟地址，以 TRAPFRAME 和 MAKE_SATP(proc.pgtbl) 为参数调用它。
    post:
    - 经 user_return 切换用户页表、恢复用户寄存器并执行 sret，从保存的用户 PC 进入或继续 U-mode，不正常返回。
    - 不把保存的用户 sp 和 PC 重置为初始值；下一次用户 trap 经 user_vector 使用已准备的内核入口信息。
    - 用户态期间 sscratch 保存 TRAPFRAME，用户可访问页面及特殊页面的权限保持不变。

  user_return:
    pre:
    - 由 trap_user_return 在 TRAMPOLINE 中以 (TRAPFRAME, MAKE_SATP(proc.pgtbl)) 调用；调用时内核页表有效，用户寄存器已保存在 trapframe 中。
    effects:
    - 切换 satp 为用户页表并刷新 TLB，此后只经 TRAPFRAME 访问 trapframe。
    - 恢复全部通用寄存器，并以 sscratch 交换恢复 a0。
    - 以 sret 返回 U-mode，PC 取 sepc。
    post:
    - 用户以 trapframe 中的寄存器、PC 与栈继续执行；satp 为用户页表，sscratch 复位为 TRAPFRAME。
    - 本入口不返回；下一次用户 trap 由 user_vector 在同一 trapframe 上重新保存现场。
