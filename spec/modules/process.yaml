module: kernel/process
owns:
- src/kernel/proc/proc.c
- src/kernel/proc/swtch.S
- src/kernel/proc/type.h
- src/kernel/proc/method.h
state:
  cpus: 每hart的当前进程指针与保存的内核上下文；由OpenSBI交付并写入tp的物理hart ID直接索引。qemu有效hart为0..1，FIRST_HART=0、NCPU=2；vf2的FIRST_HART、NCPU由学生填写，FIRST_HART以下的槽位不运行。
  proczero: 唯一用户进程，拥有用户页表、trapframe、用户代码页和栈页；使用预先映射的 KSTACK(0)。
  context_t: 依次为 ra、sp、s0..s11 的 64 位槽；C 与 swtch 汇编布局一致。
  user_trapframe_t: 288 字节：前五槽为 kernel_satp/kernel_sp/kernel_trap/epc/kernel_hartid，其后按给定头文件排列全部用户整数寄存器；a0
    偏移112，t6偏移280。
  trapframe_alias: trapframe 页在用户页表中以 TRAPFRAME 出现（RW，不含 PTE_U）；内核页表不映射 TRAPFRAME，内核经恒等映射以物理地址访问同一页，proc.tf 保存该内核可见地址。
rules:
- 首进程构造完成前不得发布为运行状态；失败不留下半初始化进程。
- 虚拟地址零页不映射；TRAMPOLINE RX 和 TRAPFRAME RW 不含 PTE_U；用户代码 RXU、栈 RWU。
- 本阶段不引入多进程 scheduler；首进程通过 swtch 与 trap_user_return 首次进入用户态。
- cpu.proc 只在页表、trapframe、用户栈与代码页全部就绪后写入一次；本阶段仅启动核boot_hartid发布并运行proczero，其他有效hart驻留，不引入调度行为。
functions:
  cpu_t *mycpu(void):
    pre:
    - 当前在S-mode，tp保存OpenSBI交付的有效物理hart ID，满足FIRST_HART<=hart<NCPU；不转换为逻辑CPU编号。
    effects: []
    post:
    - 返回 tp 对应的 cpus 元素；无效 hart id 是内核不变量错误。

  proc_t *myproc(void):
    pre:
    - 当前在S-mode，tp 保存有效 hart ID。
    effects: []
    post:
    - 返回当前 hart 的进程指针，允许 NULL；cpu.proc 只在首进程构造完成后写入，读取无需关中断。

  # 保留 Lab4 契约；Lab5 mmap 初始化和失败回滚要求见 patches/lab5.yaml，尚待学生完成。
  pgtbl_t proc_pgtbl_init(uint64 trapframe):
    pre:
    - 当前处于 S-mode，物理内存分配器已初始化。
    - trapframe 是调用者已分配并持有的、页对齐的有效物理页地址。
    - trampoline 代码已存在于页对齐的物理页中，且大小不超过一页。
    effects:
    - 分配并清零根页表，以及建立映射所需的中间页表页。
    - 将 TRAMPOLINE 映射到 trampoline 代码物理页，权限为 R、X，不含 PTE_U。
    - 将 TRAPFRAME 映射到参数 trapframe 指定的物理页，权限为 R、W，不含 PTE_U。
    post:
    - 成功返回新建的 Sv39 根页表指针，仅包含上述两处有效叶映射；零页、用户代码和用户栈尚未映射。
    - 不切换当前页表，不修改 trapframe 页内容，不改变进程或 CPU 的状态。
    - 分配或映射失败直接 panic 锁死。

  void proc_make_first(void):
    pre:
    - 仅由启动核 boot_hartid 在 S-mode 单次调用，tp 保存有效 hart ID，首进程尚未发布。
    - 物理分配器、内核页表和本 hart 的 trap 环境已初始化，KSTACK(0) 已映射一页 RW 内核栈。
    - initcode 长度不超过 PGSIZE，链接入口为用户虚拟地址 0x1000；trap_user_return 已实现。
    effects:
    - 设置 pid 为 0，从内核区分配清零 trapframe 页，创建用户页表并保存 tf 和 pgtbl。
    - 从用户区分配一页用户栈，在 TRAPFRAME-PGSIZE 建立 RWU 映射，设置 ustack_npage 为 1。
    - 从用户区分配一页代码内存，复制 initcode_len 字节，在 0x1000 建立 RXU 映射，设置 heap_top 为 0x2000。
    - 设置 tf.sp 为 TRAPFRAME、tf.user_to_kern_epc 为 0x1000，其余初始用户通用寄存器保持零。
    - 设置 kstack 为 KSTACK(0)、ctx.sp 为 kstack+PGSIZE、ctx.ra 为 trap_user_return 地址。
    - 资源和现场准备完成后发布当前 cpu.proc，再调用 swtch 保存 CPU 内核上下文并恢复进程上下文。
    post:
    - 成功经 trap_user_return 首次进入 U-mode，从 0x1000 执行用户代码，不正常返回调用者。
    - 零页未映射，TRAMPOLINE 和 TRAPFRAME 不含 PTE_U；首进程仅由启动核 boot_hartid 发布和运行。
    - 构造失败时不发布 cpu.proc，回收临时资源，不遗留半初始化进程。

  void swtch(context_t *old, context_t *new):
    pre:
    - old/new 是互不重叠的可读写有效 context_t；目标 sp/ra 有效。
    effects:
    - 写 old 上下文，替换当前寄存器和控制流。
    post:
    - 保存当前 ra/sp/s0..s11 到 old，恢复 new 对应寄存器，经恢复的 ra 继续；old 将来被恢复时，本次调用才继续返回。
